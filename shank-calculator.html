<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ring Shank Calculator</title>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .card {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        select, input {
            width: 100%;
            padding: 0.875rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .result-box {
            margin-top: 2.5rem;
            padding: 1.5rem;
            background: #eff6ff;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #bfdbfe;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e3a8a;
            margin: 0.5rem 0;
        }

        .formula-hint {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Blank Length Calculator</h2>
        
        <div class="form-group">
            <label for="ringSize">US Ring Size</label>
            <select id="ringSize">
                <!-- Options populated by JavaScript -->
            </select>
        </div>

        <div class="form-group">
            <label for="thickness">Shank Thickness (mm)</label>
            <input type="number" id="thickness" step="0.01" min="0.1" value="1.50">
        </div>

        <div class="result-box">
            <div class="result-label">Required Length</div>
            <div class="result-value" id="output">-- mm</div>
            <div class="formula-hint" id="formulaText">(Diameter + Thickness) × 3.14</div>
        </div>
    </div>

    <script>
        const ringSizes = {
            "1.0": 12.0, "1.25": 12.2, "1.5": 12.4, "1.75": 12.6,
            "2.0": 12.8, "2.25": 13.0, "2.5": 13.3, "2.75": 13.5,
            "3.0": 13.7, "3.25": 13.9, "3.5": 14.1, "3.75": 14.3,
            "4.0": 14.5, "4.25": 14.7, "4.5": 14.9, "4.75": 15.1,
            "5.0": 15.3, "5.25": 15.5, "5.5": 15.7, "5.75": 15.9,
            "6.0": 16.1, "6.25": 16.3, "6.5": 16.5, "6.75": 16.7,
            "7.0": 16.9, "7.25": 17.1, "7.5": 17.3, "7.75": 17.5,
            "8.0": 17.7, "8.25": 17.9, "8.5": 18.1, "8.75": 18.3,
            "9.0": 18.5, "9.25": 18.7, "9.5": 18.9, "9.75": 19.1,
            "10.0": 19.3, "10.25": 19.5, "10.5": 19.7, "10.75": 19.9,
            "11.0": 20.1, "11.25": 20.3, "11.5": 20.5, "11.75": 20.7,
            "12.0": 20.9, "12.25": 21.1, "12.5": 21.3, "12.75": 21.5,
            "13.0": 21.7, "13.25": 21.9, "13.5": 22.1, "13.75": 22.3,
            "14.0": 22.5, "14.25": 22.7, "14.5": 22.9, "14.75": 23.1,
            "15.0": 23.3, "15.25": 23.5, "15.5": 23.7, "15.75": 23.9,
            "16.0": 24.1
        };

        const sizeSelect = document.getElementById('ringSize');
        const thicknessInput = document.getElementById('thickness');
        const outputDiv = document.getElementById('output');
        const formulaText = document.getElementById('formulaText');

        for (const [size, diameter] of Object.entries(ringSizes)) {
            const option = document.createElement('option');
            option.value = diameter;
            option.text = `Size ${size} (${diameter} mm)`;
            if (size === "7.0") option.selected = true;
            sizeSelect.appendChild(option);
        }

        function calculate() {
            const diameter = parseFloat(sizeSelect.value);
            const thickness = parseFloat(thicknessInput.value);
            
            if (diameter && thickness >= 0) {
                const length = (diameter + thickness) * 3.14;
                outputDiv.textContent = length.toFixed(2) + " mm";
                formulaText.textContent = `(${diameter} + ${thickness}) × 3.14`;
            } else {
                outputDiv.textContent = "-- mm";
                formulaText.textContent = "Please enter valid numbers";
            }
        }

        sizeSelect.addEventListener('change', calculate);
        thicknessInput.addEventListener('input', calculate);

        calculate();
    </script>
</body>
</html>
